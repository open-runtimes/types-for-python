[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-runtimes"
version = "0.0.1"
description = "Types for Python Open Runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Open Runtimes", email = "team@appwrite.io"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/open-runtimes/types-for-python"
Repository = "https://github.com/open-runtimes/types-for-python"
